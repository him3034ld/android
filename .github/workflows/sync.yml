name: mirror
on: workflow_dispatch
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - run: docker pull redroid/redroid:11.0.0-latest
      - run: docker save redroid/redroid:11.0.0-latest | gzip > redroid.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: redroid
          path: redroid.tar.gz
          retention-days: 7
